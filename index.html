<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F3343">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" sizes="180x180">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="神聖的愛">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>LINE流通神聖的愛圖卡建立平台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root {
    /* 平台配色「米白暖杏」（三個 LINE 平台各一色：活動登記鼠尾草綠、連結卡霧藍、這裡暖杏）；
       海軍藍內文、金色封蠟、磚紅保留；信紙各有自己的顏色。文字對比都 ≥ 4.5（WCAG AA） */
    --sky: #FAF6F0; --sky-2: #F3EADC; --card: #FFFFFF;
    --ink: #2F3343; --ink-2: #67645F; --rule: #EADFCE;
    --gold: #A9824E; --gold-text: #7E5B2C; --gold-soft: rgba(169,130,78,.16); --on-gold: #1F1709;
    --stamp: #B03A2E; --ok: #2E6B4F;
    --shadow: 0 1px 2px rgba(60,40,20,.05), 0 8px 24px rgba(60,40,20,.08);
    --serif: "Noto Serif TC", "Songti TC", serif;
    --sans: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    /* 信紙（預設素雅） */
    --p-paper: #FBF8F1; --p-ink: #2F3343; --p-accent: #2F3343; --p-line: #E6DFD0; --p-env: #E6DFCF; --p-flap: #D6CCB8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--sky); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.6; -webkit-text-size-adjust: 100%; }
  button, input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  [hidden] { display: none !important; }
  #app { max-width: 480px; margin: 0 auto; padding: 0 16px calc(96px + env(safe-area-inset-bottom)); position: relative; z-index: 1; }

  header.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 0 -16px 18px; padding: calc(18px + env(safe-area-inset-top)) 16px 16px; background: var(--ink); color: #F7F1E4; border-bottom: 3px solid var(--gold); }
  header.top .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  header.top img { width: 38px; height: 38px; flex: none; }
  header.top h1 { font-family: var(--serif); font-weight: 900; font-size: 21px; letter-spacing: .05em; margin: 0; white-space: nowrap; }
  header.top .who { color: #C9C2B3; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .demo-note { background: var(--gold-soft); color: var(--gold-text); font-size: 13px; padding: 8px 12px; border-radius: 8px; margin: 0 0 14px; }

  h2 { font-family: var(--serif); font-size: 22px; margin: 6px 0 4px; }
  .muted { color: var(--ink-2); }
  .small { font-size: 14px; }
  .card { background: var(--card); border: 1px solid var(--rule); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); margin: 12px 0; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 48px; padding: 10px 20px; border-radius: 999px; border: 0; background: var(--ink); color: #fff; font-weight: 700; cursor: pointer; text-decoration: none; }
  .btn.block { display: flex; width: 100%; }
  .btn.gold { background: var(--gold); color: var(--on-gold); } /* 主按鈕：暖杏底、深色字，對比 ≥ AA */
  .btn.ghost { background: var(--sky-2); color: var(--ink); border: 1.5px solid var(--rule); } /* 次要：淺米底、深字 */
  .btn.danger { background: #F8EEEC; color: var(--stamp); border: 1.5px solid #E7C6C1; } /* 危險：淺紅底、磚紅字 */
  .btn.armed { background: var(--stamp); color: #fff; }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin: 12px 0; }
  .btn-row .btn { flex: 1 1 140px; }
  .btn-row.col { flex-direction: column; }
  .btn-row.col .btn { flex: none; }
  .back { background: none; border: 0; color: var(--ink-2); padding: 6px 0; cursor: pointer; font-size: 15px; }
  .link { background: none; border: 0; color: var(--gold-text); text-decoration: underline; cursor: pointer; padding: 4px 0; font-size: 14px; }
  .foot { text-align: center; margin-top: 28px; }

  label.f { display: block; margin: 14px 0 4px; font-weight: 700; font-size: 15px; }
  .f-hint { font-size: 13px; color: var(--ink-2); margin: 2px 0 0; }
  input.in, textarea.in { width: 100%; padding: 12px 14px; border: 1.5px solid var(--rule); border-radius: 10px; background: #fff; font-size: 16px; }
  textarea.in { min-height: 96px; resize: vertical; }
  select.in { width: 100%; appearance: auto; min-height: 48px; padding: 10px 12px; border: 1.5px solid var(--rule); border-radius: 10px; background: #fff; font-size: 16px; }

  .chip { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: var(--sky-2); color: var(--ink-2); white-space: nowrap; }
  .chip.open { background: #E1EEE6; color: var(--ok); }
  .chip.ended, .chip.closed { background: #F3E1DE; color: var(--stamp); }
  .chip.paired { background: #E1EEE6; color: var(--ok); }
  .chip.pending { background: var(--gold-soft); color: var(--gold-text); }

  /* 活動列表 */
  .act { display: block; width: 100%; text-align: left; cursor: pointer; }
  .act .t { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .act h3 { margin: 0; font-family: var(--serif); font-size: 18px; }
  .act .s { margin-top: 6px; font-size: 14px; color: var(--ink-2); }
  body.has-act-theme { background: var(--theme-tint, var(--sky)); }
  body.has-act-theme::before { content: ''; position: fixed; inset: 0; background-image: var(--theme-mark); background-repeat: no-repeat; background-position: center 28%; background-size: min(92vw, 460px); opacity: .08; pointer-events: none; z-index: 0; }
  .theme-card { background-color: var(--theme-tint, var(--card)); border-color: var(--theme-line, var(--rule)); position: relative; isolation: isolate; overflow: hidden; }
  .theme-card::before { content: ''; position: absolute; inset: 0; background: var(--theme-mark) center / 92% no-repeat; opacity: .10; pointer-events: none; z-index: 0; }
  .theme-card::after { content: ''; position: absolute; inset: 7px; border: 1px solid color-mix(in srgb, var(--theme-accent) 30%, transparent); border-radius: 10px; pointer-events: none; z-index: 1; }
  .theme-card > * { position: relative; z-index: 2; }
  .theme-hero { position: relative; margin: 0 -6px 10px; padding: 12px 12px 14px; border-radius: 16px; background: color-mix(in srgb, var(--theme-tint, var(--sky-2)) 70%, #fff); border: 1px solid var(--theme-line, var(--rule)); overflow: hidden; }
  .theme-hero::before { content: ''; position: absolute; inset: 0; background: var(--theme-mark) right 8% center / 200px no-repeat; opacity: .10; pointer-events: none; }
  .theme-hero > * { position: relative; z-index: 1; }
  .empty { text-align: center; padding: 28px 16px; color: var(--ink-2); }

  /* 後台統計 */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
  .stat { background: var(--card); border: 1px solid var(--rule); border-radius: 12px; padding: 10px 6px; text-align: center; }
  .stat b { display: block; font-family: var(--serif); font-size: 26px; line-height: 1.2; }
  .stat span { font-size: 13px; color: var(--ink-2); }
  .tabs { display: flex; gap: 6px; margin: 14px 0 6px; }
  .tabs button { flex: 1 1 auto; padding: 0 10px; white-space: nowrap; min-height: 40px; border-radius: 999px; border: 1.5px solid var(--rule); background: transparent; font-size: 14px; cursor: pointer; }
  .tabs button[aria-pressed=true] { background: var(--ink); color: #fff; border-color: var(--ink); }
  .pair { border-bottom: 1px solid var(--rule); padding: 12px 2px; }
  .pair:last-child { border-bottom: 0; }
  .pair > button { display: flex; width: 100%; justify-content: space-between; align-items: center; gap: 8px; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
  .pair .names { font-weight: 700; min-width: 0; }
  .pair .names .arrow { color: var(--gold); margin: 0 6px; }
  .pair .when { font-size: 12px; color: var(--ink-2); margin-top: 2px; }
  .pair .body { margin-top: 10px; }

  /* 信紙：每組一行，節日／場合與日常左對齊；按鈕可換行，不要左右滑動 */
  .papers { display: flex; flex-direction: column; gap: 8px; margin: 4px 0 8px; padding: 0; overflow: visible; }
  .papers .pg-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .papers .pg { flex: none; font-size: 12px; color: var(--ink-2); margin: 0; width: 5.6em; }
  .papers button { flex: none; display: inline-flex; align-items: center; gap: 4px; min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1.5px solid var(--rule); background: var(--bg); color: var(--c); font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .papers button i { font-style: normal; }
  .papers button[aria-pressed=true] { background: var(--c); border-color: var(--c); color: #fff; }
  .music-hint { font-size: 13px; color: var(--ink-2); margin: 0 0 12px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .music-hint button { font-size: 13px; }
  .paper { position: relative; background-color: var(--p-paper); color: var(--p-ink); border-radius: 6px 6px 10px 10px; border-top: 6px solid var(--p-accent);
    padding: 16px 20px 24px; box-shadow: 0 2px 4px rgba(60,30,30,.06), 0 14px 32px rgba(90,40,40,.12); font-family: var(--serif); line-height: 32px;
    background-image: repeating-linear-gradient(to bottom, transparent 0 31px, var(--p-line) 31px 32px); background-position: 0 15px; }
  .paper .stampmark { position: absolute; top: 12px; right: 14px; width: 42px; height: 50px; border: 2px dashed var(--p-accent); border-radius: 4px; display: grid; place-items: center; color: var(--p-accent); font-size: 20px; transform: rotate(4deg); background: var(--p-paper); line-height: 1; }
  .paper .actname { font-family: var(--sans); font-size: 12px; color: var(--p-accent); font-weight: 700; letter-spacing: .1em; height: 32px; }
  .paper .dear { display: flex; align-items: baseline; gap: 6px; font-size: 19px; height: 32px; padding-right: 50px; }
  .paper .dear input { flex: 1; min-width: 0; height: 30px; border: 0; border-bottom: 1.5px dashed var(--p-accent); background: transparent; font-family: var(--serif); font-size: 19px; font-weight: 700; color: var(--p-ink); padding: 0 4px; border-radius: 0; }
  .paper .dear input::placeholder { color: color-mix(in srgb, var(--p-ink) 40%, transparent); font-weight: 500; }
  .paper textarea { display: block; width: 100%; min-height: 224px; border: 0; background: transparent; resize: none; font-family: var(--serif); font-size: 17px; line-height: 32px; color: var(--p-ink); padding: 0; margin: 0; overflow: hidden; }
  .paper textarea:focus, .paper .dear input:focus { outline: none; }
  .paper .text { white-space: pre-wrap; word-break: break-word; font-size: 17px; min-height: 96px; }
  .paper .sign { text-align: right; font-size: 17px; font-weight: 700; }
  .paper .sign.editable { display: flex; justify-content: flex-end; align-items: baseline; gap: 4px; }
  .paper .sign input { width: 11em; max-width: 70%; text-align: right; border: 0; border-bottom: 1.5px dashed var(--p-line); background: transparent; font-family: var(--serif); font-size: 17px; font-weight: 700; color: var(--p-ink); padding: 0 2px; border-radius: 0; }
  .paper .sign input:hover, .paper .sign input:focus { border-bottom-color: var(--p-accent); outline: none; }
  .paper .sign .pen { font-family: var(--sans); font-size: 13px; color: var(--p-accent); cursor: pointer; }
  .profile-edit { margin-top: 12px; padding-top: 4px; border-top: 1px solid var(--rule); }
  .warn-note { font-size: 13px; color: var(--gold-text); background: var(--gold-soft); border-radius: 10px; padding: 8px 12px; margin: 10px 0 0; }
  .paper .date { text-align: right; font-family: var(--sans); font-size: 13px; opacity: .75; }
  .paper .photo { margin: 8px 0 8px; line-height: 0; }
  .paper .photo img { width: 100%; max-height: 360px; object-fit: cover; border-radius: 4px; border: 6px solid #fff; box-shadow: 0 4px 12px rgba(0,0,0,.12); transform: rotate(-1.2deg); }
  .photo-pick { display: flex; align-items: center; gap: 8px; font-family: var(--sans); font-size: 15px; color: var(--p-accent); background: none; border: 1.5px dashed var(--p-accent); border-radius: 8px; padding: 0 12px; height: 40px; margin: 12px 0 12px; cursor: pointer; }
  .photo-wrap { position: relative; }
  .photo-x { position: absolute; top: 4px; right: 4px; width: 34px; height: 34px; border-radius: 50%; border: 0; background: rgba(0,0,0,.6); color: #fff; font-size: 18px; cursor: pointer; line-height: 1; }
  .verse { margin: 0 0 8px; }
  .verse .v-title { font-family: var(--sans); font-size: 14px; font-weight: 700; color: var(--p-accent); height: 32px; display: flex; align-items: center; gap: 6px; }
  .verse input { width: 100%; height: 32px; border: 0; border-bottom: 1.5px dashed var(--p-accent); background: transparent; font-family: var(--serif); font-size: 16px; font-weight: 700; color: var(--p-ink); padding: 0 2px; border-radius: 0; }
  .verse textarea { min-height: 96px !important; }
  .verse input:focus, .verse textarea:focus { outline: none; }
  .verse-picks { display: flex; flex-direction: column; gap: 8px; overflow: visible; padding: 4px 0 6px; margin: 0; font-family: var(--sans); line-height: 1.4; }
  .verse-picks .vg { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .verse-picks .vg-lab { flex: none; font-size: 12px; font-weight: 700; color: var(--p-accent); width: 2.6em; }
  .verse-picks button { flex: none; border: 1.5px solid var(--p-line); background: #fff; color: var(--p-ink); border-radius: 999px; padding: 5px 12px; font-size: 13px; cursor: pointer; white-space: nowrap; }
  .verse-picks button[aria-pressed=true] { background: var(--p-accent); border-color: var(--p-accent); color: #fff; }
  .verse-show { border-left: 3px solid var(--p-accent); padding-left: 12px; margin: 8px 0; }
  .verse-show .ref { font-family: var(--sans); font-size: 14px; font-weight: 700; color: var(--p-accent); }
  .verse-show .vt { white-space: pre-wrap; font-size: 16px; }
  .lock-note { font-size: 13px; color: var(--ink-2); background: var(--card); border: 1px solid var(--rule); border-radius: 10px; padding: 10px 12px; margin: 14px 0; }
  .paper.mini { padding: 10px 14px 14px; line-height: 28px; background-image: repeating-linear-gradient(to bottom, transparent 0 27px, var(--p-line) 27px 28px); background-position: 0 9px; box-shadow: none; border: 1px solid var(--p-line); border-top: 4px solid var(--p-accent); }
  .paper.mini .text { font-size: 15px; min-height: 0; }

  /* 信封 */
  .env-stage { perspective: 900px; margin: 20px auto 8px; max-width: 340px; }
  .env { position: relative; aspect-ratio: 7 / 5; background: var(--p-env); border-radius: 10px; box-shadow: 0 2px 4px rgba(60,30,30,.08), 0 18px 40px rgba(90,40,40,.18); }
  .env::before { content: ""; position: absolute; inset: 0; border-radius: 10px; background: linear-gradient(to top right, transparent 49.6%, rgba(255,255,255,.28) 50%, transparent 50.4%), linear-gradient(to top left, transparent 49.6%, rgba(255,255,255,.28) 50%, transparent 50.4%); }
  /* 蓋板尖端、封蠟在上半部，「To. 名字」在下半部，兩者不重疊（320px 也一樣） */
  .env .flap { position: absolute; left: 0; right: 0; top: 0; height: 44%; background: var(--p-flap); clip-path: polygon(0 0, 100% 0, 50% 100%); transform-origin: top; transition: transform .7s ease, opacity .3s ease .4s; border-radius: 10px 10px 0 0; z-index: 2; }
  .env .seal { position: absolute; left: 50%; top: 44%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: var(--p-accent); color: #fff; display: grid; place-items: center; font-size: 21px; z-index: 3; box-shadow: 0 2px 6px rgba(0,0,0,.25); transition: opacity .3s; }
  .env .to { position: absolute; left: 0; right: 0; bottom: 9%; padding: 0 16px; line-height: 1.35; text-align: center; color: var(--p-ink); font-family: var(--serif); z-index: 1; }
  .env .to small { display: block; font-size: 13px; opacity: .75; font-family: var(--sans); }
  .env .to b { display: block; font-size: 24px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* 掀開後蓋板會翻到信封上方：最後淡出，才不會蓋住上面的標題 */
  .env.open .flap { transform: rotateX(180deg); z-index: 0; opacity: 0; }
  .env.open .seal { opacity: 0; }
  .center { text-align: center; }
  .nowrap { white-space: nowrap; }
  .big-emoji { font-size: 44px; line-height: 1; margin: 18px 0 6px; }
  .fade-up { animation: fadeUp .6s ease both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .env .flap, .fade-up { transition: none; animation: none; } }

  .loading { display: flex; justify-content: center; gap: 8px; padding: 80px 0; }
  .loading .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--gold); animation: blink 1s infinite alternate; }
  .loading .dot:nth-child(2) { animation-delay: .2s; } .loading .dot:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { from { opacity: .25; } to { opacity: 1; } }
  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 14px; opacity: 0; pointer-events: none; transition: .25s; max-width: calc(100% - 32px); text-align: center; z-index: 9; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .install { text-align: center; padding-top: 40px; }
  .install .app-icon { border-radius: 22px; box-shadow: var(--shadow); }
  .install h1 { font-family: var(--serif); font-weight: 900; font-size: 24px; margin: 14px 0 4px; }
  .install-steps { text-align: left; background: var(--card); border: 1px solid var(--rule); border-radius: 14px; padding: 14px 18px 14px 38px; margin: 18px 0 0; line-height: 1.9; }
  .guide-bg { position: fixed; inset: 0; background: rgba(30,33,48,.55); display: grid; place-items: end center; z-index: 20; padding: 16px; }
  @media (min-height: 640px) { .guide-bg { place-items: center; } }
  .guide { width: 100%; max-width: 420px; background: var(--card); border-radius: 18px; padding: 24px 20px 18px; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
  .guide .g-emoji { font-size: 40px; line-height: 1; text-align: center; }
  .guide h3 { font-family: var(--serif); font-size: 20px; text-align: center; margin: 10px 0 6px; }
  .guide p { margin: 0; color: var(--ink-2); font-size: 15px; text-align: left; min-height: 0; line-height: 1.55; }
  .guide-samples { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 12px 0 0; }
  .guide-samples .btn { min-height: 36px; padding: 4px 14px; font-size: 13px; pointer-events: none; cursor: default; }
  .guide .dots { display: flex; justify-content: center; gap: 6px; margin: 14px 0; }
  .guide .dots span { width: 7px; height: 7px; border-radius: 50%; background: var(--rule); }
  .guide .dots span.on { background: var(--gold); width: 18px; border-radius: 4px; }
  .guide .btn-row { margin: 0; }
  .guide .guide-credit { margin: 16px 0 0; font-size: 11px; color: var(--ink-2); text-align: center; min-height: 0; line-height: 1.45; }
  .guide .guide-credit a { color: inherit; text-decoration: underline; }
  .cover-pick { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .cover-pick .btn { min-height: 40px; padding: 6px 14px; font-size: 14px; }
  .cover-thumb { position: relative; margin-top: 8px; width: 140px; border-radius: 10px; overflow: hidden; aspect-ratio: 20 / 13; background: var(--sky-2); }
  .cover-thumb .photo-x { width: 28px; height: 28px; font-size: 15px; }
  .cover-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cover-err { color: var(--stamp); font-size: 13px; margin: 4px 0 0; }
  .myacts h3 { font-family: var(--serif); font-size: 18px; margin: 20px 0 8px; }
  .myact { display: flex; width: 100%; gap: 12px; align-items: center; text-align: left; background: var(--card); border: 1px solid var(--rule); border-left: 6px solid var(--ma-accent, var(--gold)); border-radius: 12px; padding: 10px 12px; margin: 0 0 8px; cursor: pointer; }
  .myact .ma-img { flex: none; width: 52px; height: 52px; border-radius: 10px; overflow: hidden; background: var(--ma-env, var(--sky-2)); display: grid; place-items: center; font-size: 20px; color: var(--ma-accent); }
  .myact .ma-img img { width: 100%; height: 100%; object-fit: cover; display: block; }

const paperOf = k => PAPERS[k] || PAPERS.rose;
const papersIn = (g, keep) => Object.entries(PAPERS).filter(([k, p]) => p.group === g && (!p.hidden || k === keep));
const paperVars = k => { const p = paperOf(k); return `--p-paper:${p.paper};--p-ink:${p.ink};--p-accent:${p.accent};--p-line:${p.line};--p-env:${p.env};--p-flap:${p.flap}`; };

const THEME_DECO = {

/* 主題背景音樂：輕柔循環、預設音量 0.35；點選主題後才載入，離開寫信／收信頁會停 */
let themeAudio = null, themeAudioKey = '', themeWantSound = true;
function stopThemeMusic() {
  if (!themeAudio) { themeAudioKey = ''; return; }
  try { themeAudio.pause(); themeAudio.removeAttribute('src'); themeAudio.load(); } catch (e) {}
  themeAudio = null; themeAudioKey = '';
  const t = $('w-music-toggle'); if (t) t.hidden = true;
}
function previewThemeMusic(k) {
  if (!PAPERS[k]) return;
  if (themeAudioKey === k && themeAudio && !themeAudio.paused) return;
  stopThemeMusic();
  if (!themeWantSound) { themeAudioKey = k; return; }
  const a = new Audio();          // 延遲載入：點了才建立
  a.src = 'audio/' + encodeURIComponent(k) + '.mp3';
  a.loop = true;
  a.preload = 'auto';
  a.volume = 0.35;
  themeAudio = a;
  themeAudioKey = k;
  const p = a.play();
  if (p && p.catch) p.catch(() => {});
  syncMusicToggle();
}
function toggleThemeMusic() {
  if (themeAudio && !themeAudio.paused) {
    themeAudio.pause();
    themeWantSound = false;
  } else {
    themeWantSound = true;
    if (themeAudio) {
      const p = themeAudio.play();
      if (p && p.catch) p.catch(() => {});
    } else if (themeAudioKey) previewThemeMusic(themeAudioKey);
  }
  syncMusicToggle();
}
function syncMusicToggle() {
  const t = $('w-music-toggle');
  if (!t) return;
  const on = !!(themeAudio && !themeAudio.paused);
  t.hidden = !(themeAudio || themeAudioKey);
  t.textContent = on ? '停止音樂' : '播放音樂';
}
function bindWriterMusic() {
  const t = $('w-music-toggle');
  if (t) t.onclick = toggleThemeMusic;
  syncMusicToggle();
}
function bindListenHint(paper) {
  const b = $('l-music');
  if (!b || !PAPERS[paper]) return;
  const setLabel = on => { b.textContent = on ? '停止音樂' : '🔈 打開聲音聆聽'; };
  setLabel(!!(themeAudio && !themeAudio.paused && themeAudioKey === paper));
  b.onclick = () => {
    if (themeAudio && !themeAudio.paused && themeAudioKey === paper) {
      themeAudio.pause();
      themeWantSound = false;
      setLabel(false);
    } else {
      themeWantSound = true;
      previewThemeMusic(paper);
      setLabel(true);
    }
  };
}

const cacheGet = k => CACHE_OK ? cacheAll()[k] : null;
const cacheSet = (k, v) => { if (!CACHE_OK) return; try { const c = cacheAll(); c[k] = v; localStorage.setItem(CACHE_KEY, JSON.stringify(c)); } catch (e) { try { localStorage.removeItem(CACHE_KEY); } catch (_) {} } };

async function api(action, data = {}) {
  if (DEMO) return demoApi(action, data);
  const body = { action, ...data };
  if (!PUBLIC.includes(action)) {
    const s = action === 'session' ? null : getSession();
    if (s) body.session = s.token; else body.idToken = liff.getIDToken();
  }
  if (navigator.onLine === false) throw new Error('目前沒有網路連線，請連上網路後再試一次');
  let j;
  try {
    const r = await fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
    j = await r.json();
  } catch (e) { throw new Error('連線不穩，請稍後再試一次'); }
  if (!j.ok) {
    if (j.error === 'SESSION_EXPIRED') {
      setSession(null);
      if (liff.isLoggedIn()) return api(action, data);
      liff.login({ redirectUri: location.href }); throw new Error('登入已過期，正在重新登入');
    }
    if (j.error === 'TOKEN_EXPIRED') { liff.logout(); liff.login({ redirectUri: location.href }); throw new Error('登入已過期，正在重新登入'); }
    throw new Error(j.error);
  }
  return j;
}

/** 兩段式確認：第一次按變成「再按一次確認」 */
function armThen(btn, label, fn) {
  if (btn.disabled || btn.dataset.busy) return;
  if (btn.classList.contains('armed')) { btn.classList.remove('armed'); return fn(); }
  const old = btn.textContent; btn.textContent = label; btn.classList.add('armed');
  setTimeout(() => { if (btn.isConnected && btn.classList.contains('armed')) { btn.classList.remove('armed'); btn.textContent = old; } }, 4000);
}
/** 請求編號：同一次動作連點或重試都送同一個，後端據此只做一次 */
const newRid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 12));
/** 按鈕處理中：連點只算一次（先同步檢查旗標，再 disabled）；成功後換掉請求編號，失敗時保留，再按一次後端不會重複寫入 */
async function busy(btn, fn) {
  if (!btn || btn.disabled || btn.dataset.busy) return;
  btn.dataset.busy = '1';
  const rid = btn.dataset.rid || (btn.dataset.rid = newRid());
  const old = btn.innerHTML; btn.disabled = true; btn.textContent = '處理中…';
  try { const r = await fn(rid); delete btn.dataset.rid; return r; }
  catch (e) { toast(e.message); }
  finally { delete btn.dataset.busy; if (btn.isConnected) { btn.disabled = false; btn.innerHTML = old; } }
}

let UPLOADING = false;
function drawPhoto(keep) {
  const box = $('w-photo');
  if (PHOTO && !imgOk(PHOTO)) PHOTO = '';
  if (PHOTO) {
    box.innerHTML = `<div class="photo photo-wrap"><img src="${esc(PHOTO)}" alt="附上的照片"><button class="photo-x" id="p-x" type="button" aria-label="移除照片">×</button></div>`;
    $('p-x').onclick = () => { PHOTO = ''; drawPhoto(keep); keep(); };
  } else {
    box.innerHTML = `<button class="photo-pick" id="p-pick" type="button">📷 附一張照片（可不附）</button><input type="file" id="p-file" accept="image/*" hidden>`;
    $('p-pick').onclick = () => { if (!UPLOADING) $('p-file').click(); };
    $('p-file').onchange = async e => {
      const f = e.target.files && e.target.files[0]; e.target.value = '';
      if (!f || UPLOADING) return;
      UPLOADING = true;
      $('p-pick').textContent = '照片上傳中…'; $('p-pick').disabled = true;
      try {
        const data = await shrinkImage(f, 1200, 0.85);
        PHOTO = (await api('uploadImage', { data, mime: 'image/jpeg', rid: newRid() })).url;
        drawPhoto(keep); keep();
      } catch (err) { toast('上傳失敗：' + err.message); drawPhoto(keep); }
      finally { UPLOADING = false; }
    };
  }
}

function shrinkImage(file, maxW, quality) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxW / img.naturalWidth);
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * scale); c.height = Math.round(img.naturalHeight * scale);
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
      g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      resolve(c.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => reject(new Error('無法讀取這張照片'));
    img.src = URL.createObjectURL(file);
  });
}

let TEMPLATES = null;
async function drawTemplates({ fill }) {
  const box = $('a-tpl'); if (!box) return;
  if (!TEMPLATES) { try { TEMPLATES = (await api('listTemplates', {})).templates || []; } catch (e) { TEMPLATES = []; } }
  if (!box.isConnected) return;
  if (!TEMPLATES.length) { box.hidden = true; return; }

    box.hidden = false;
    box.innerHTML = `<p class="tpl-head">📋 從範本開始（點一下套用）</p><div class="tpl-list">${TEMPLATES.map(t => {
      const p = paperOf(t.paper);

        <div class="tpl-img">${imgOk(t.image) ? `<img src="${esc(t.image)}" alt="" loading="lazy">` : esc(p.sym)}</div>

        <div class="tpl-meta">${t.mine ? (t.shared ? '我的・已分享' : '我的') : '共享・' + esc(t.creator)}</div>
        ${t.mine || (ME && (ME.isAdmin || ME.isSuper)) ? `<span class="tpl-x" role="button" tabindex="0" data-tdel="${esc(t.id)}" aria-label="刪除範本">×</span>` : ''}
      </button>`; }).join('')}</div>`;
    box.querySelectorAll('[data-tpl]').forEach(b => b.onclick = ev => {
      if (ev.target.closest('[data-tdel]')) return;
      const t = TEMPLATES.find(x => x.id === b.dataset.tpl); picked = t.id; draw(); fill(t);
    });
    box.querySelectorAll('[data-tdel]').forEach(x => x.onclick = ev => {
      ev.stopPropagation();

        TEMPLATES = TEMPLATES.filter(t => t.id !== x.dataset.tdel); toast('已刪除範本');
        if (TEMPLATES.length) draw(); else box.hidden = true;
      }));

}

let DETAIL = null, FILTER = 'all', OPENED_ROW = '';
async function renderDetail(id) {
  FILTER = 'all'; OPENED_ROW = '';
  const known = ACTS.find(x => x.id === id);
  if (known && known.state === 'open') rememberAct(id);
  const cached = DEMO ? null : cacheGet('detail:' + id);
  if (cached) { DETAIL = cached; drawDetail(); }
  else view(`${topHtml(ME.name || ME.displayName)}${loading()}`, 'detail:' + id, themeOf((ACTS.find(x => x.id === id) || {})));
  let fresh;
  try { fresh = await api('actDetail', { actId: id }); }
  catch (e) { if (cached) { toast('無法更新：' + e.message); return; } throw e; }
  cacheSet('detail:' + id, fresh);
  const i = ACTS.findIndex(x => x.id === id); if (i >= 0) { ACTS[i] = { ...ACTS[i], ...fresh.act }; saveHome(); }
  if (VIEW !== 'detail:' + id) return;                       // 已經離開這一頁
  const same = cached && JSON.stringify(cached) === JSON.stringify(fresh);
  DETAIL = fresh;
  if (fresh.act && fresh.act.state === 'open') rememberAct(id);
  if (!same) { const y = scrollY; drawDetail(); scrollTo(0, y); }
}

function sheetPng(title, sub, rows) {
  const today = new Date().toLocaleDateString('zh-TW', { year: 'numeric', month: 'numeric', day: 'numeric' });
  const dpr = Math.max(2, Math.min(3, window.devicePixelRatio || 2));
  const W = 720, pad = 36, lineH = 48;

  ctx.font = '700 28px "Noto Serif TC", "Songti TC", serif';
  titleLines.forEach(line => { ctx.fillText(line, x + 28, cy); cy += 34; });
  ctx.font = '14px -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif';
  ctx.fillStyle = '#67645F';
  cy += 4; ctx.fillText(today, x + 28, cy); cy += 26;
  ctx.fillStyle = '#7E5B2C';
  ctx.font = '700 16px -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif';
  ctx.fillText(sub, x + 28, cy); cy += 16;
  ctx.strokeStyle = '#EADFCE'; ctx.beginPath(); ctx.moveTo(x + 28, cy); ctx.lineTo(x + cw - 28, cy); ctx.stroke();
  cy += 32;
  rows.forEach(r => {
    ctx.font = '700 18px -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif';
    ctx.fillStyle = '#2F3343';
    let name = r.name;
    if (r.st) {
      ctx.font = '14px -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif';
      const tw = ctx.measureText(r.st).width;
      ctx.fillStyle = '#67645F';
      ctx.fillText(r.st, x + cw - 28 - tw, cy);
      ctx.font = '700 18px -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif';
      ctx.fillStyle = '#2F3343';
      const budget = cw - 56 - tw - 12;
      if (ctx.measureText(name).width > budget) {
        while (name.length > 1 && ctx.measureText(name + '…').width > budget) name = name.slice(0, -1);

      }

    ctx.fillText(name, x + 28, cy);
    cy += lineH;
  });
  ctx.font = '13px -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif';
  ctx.fillStyle = '#A9824E';
  ctx.fillText('流通神聖的愛圖卡', x + 28, H - 24 - 16);

async function shareOrDownloadPng(blob, filename) {

      <div class="sign">— ${esc(l.sign || l.from || who)}</div>
      <div class="date">${esc(l.time)}</div>
    </div>
    ${footHtml()}`, 'mine-letter');
  $('ml-back').onclick = () => renderMyLetters();
}

/* ================= 總管理者：登記總覽 ================= */
async function overviewFlow() {
  view(`${topHtml()}${loading()}`);
  let me = ME;
  try { if (!me) { const r = await api('me'); me = r; ME = r; } } catch (e) {}
  if (me && me.isSuper === false) {
    return view(`${topHtml(me.name || me.displayName)}<div class="card center"><h2>沒有權限</h2><p>只有網站總管理者可以看登記總覽。</p></div>${footHtml()}`);
  }
  try {
    const r = await api('overview');
    renderOverview(r);
  } catch (e) {
    const stale = /未知的動作/.test(e.message || '');
    view(`${topHtml(me && (me.name || me.displayName) || '')}
      <button class="back" type="button" id="ov-back">‹ 返回</button>
      <div class="card center"><h2>${stale ? '後端尚未更新' : '讀取失敗'}</h2>
      <p>${stale ? '後端尚未更新，暫時看不到登記總覽。' : esc(e.message)}</p></div>${footHtml()}`);
    $('ov-back').onclick = () => { location.href = DEMO ? '?demo=admin&noguide' : './'; };
  }
}
function overviewText(people) {
  const lines = [`登記總覽（${people.length} 人）`, '姓名\t手機\tLINE名稱\t寫過\t收過\t登記時間'];
  people.forEach(p => lines.push([p.name || '', p.phone || '', p.lineName || '', p.written || 0, p.received || 0, p.time || ''].join('\t')));
  return lines.join('\n');
}
function renderOverview(r) {
  const people = r.people || [];
  const total = r.total != null ? r.total : people.length;
  view(`${topHtml(ME && (ME.name || ME.displayName) || '')}
    <button class="back" type="button" id="ov-back">‹ 返回</button>
    <div class="roster-head">
      <h2 class="overview-sum">登記總覽</h2>
      <div class="roster-acts">
        <button class="btn ghost" type="button" id="ov-copy">複製</button>
        <button class="btn ghost" type="button" id="ov-shot">截圖</button>
      </div>
    </div>
    <p class="muted" id="ov-total">共 ${total} 人已登記</p>
    <div class="card overview-list" id="ov-list">
      ${people.length ? people.map(p => `<div class="row">
        <div><div class="nm">${esc(p.name || '')}</div>
          <div class="meta">${esc(p.phone || '')}${p.lineName ? `　LINE：${esc(p.lineName)}` : ''}${p.time ? `　登記於 ${esc(p.time)}` : ''}</div></div>
        <div class="st">寫過 ${p.written || 0} 封・收過 ${p.received || 0} 封</div>
      </div>`).join('') : '<div class="empty small">還沒有人登記</div>'}
    </div>
    ${footHtml()}`);
  $('ov-back').onclick = () => { location.href = DEMO ? '?demo=admin&noguide' : './'; };
  const copy = $('ov-copy'), shot = $('ov-shot');
  if (copy) copy.onclick = e => busy(e.currentTarget, async () => {
    const ok = await copyText(overviewText(people));
    if (!ok) throw new Error('無法複製，請手動選取文字');
    toast('已複製登記總覽');
  });
  if (shot) shot.onclick = e => busy(e.currentTarget, async () => {
    const blob = await sheetPng('登記總覽', `共 ${total} 人已登記`, people.length
      ? people.map(p => ({ name: p.name || '', st: `寫過 ${p.written || 0} 封・收過 ${p.received || 0} 封` }))
      : [{ name: '還沒有人登記', st: '' }]);
    const res = await shareOrDownloadPng(blob, '登記總覽.png');
    if (res === 'cancelled') return;
    toast(res === 'shared' ? '已打開分享' : '已存成圖片');
  });
}

/* ================= 我的個人資料 ================= */

/** 個人資料頁「我參加過的活動」：寫過或收過信的活動，結束了也留著 */
function myActsHtml(acts) {
  if (!acts.length) return '';
  return `<section class="myacts" aria-label="我參加過的活動"><h3>我參加過的活動</h3>${acts.map(a => {
    const p = paperOf(a.paper);
    const bits = [];
    if (a.written) bits.push(`寫了 ${a.written} 封`);
    if (a.received) bits.push(`收到 ${a.received} 封`);
    if (a.last) bits.push(a.last);
    return `<button type="button" class="myact" data-myact="${esc(a.id)}" style="--ma-accent:${p.accent};--ma-env:${p.env}">
      <span class="ma-img">${imgOk(a.image) ? `<img src="${esc(a.image)}" alt="" loading="lazy">` : esc(p.sym)}</span>
      <span class="ma-main"><span class="ma-title" style="display:block">${esc(a.title)}</span>
        <span class="ma-meta" style="display:block">${stateChip(a.state)} ${esc(bits.join('・'))}</span></span>
      <span class="ma-go">${a.state === 'open' ? '去寫信 ›' : '看我的信 ›'}</span>
    </button>`; }).join('')}</section>`;
}

async function myDataFlow() {
  view(`${topHtml()}${loading()}`);
  const d = await api('myData');
  view(`${topHtml(d.name)}
    <button class="back" type="button" onclick="location.href='./${DEMO ? '?demo' : ''}'">‹ 返回</button>
    <h2>我的個人資料</h2>
    <div class="card">${d.found ? `
      <p>姓名：<b>${esc(d.name)}</b><br>手機：${esc(d.phone)}<br>LINE 名稱：${esc(d.lineName)}</p>
      <p class="small muted">寫過 ${d.sent} 封信・收過 ${d.received} 封信</p>
      <button class="btn ghost block" id="m-edit" type="button" aria-expanded="false">✏️ 編輯我的資料</button>
      <div class="profile-edit" id="m-form" hidden>
        <label class="f" for="m-name">姓名</label>
        <input class="in" id="m-name" autocomplete="name" maxlength="30" value="${esc(d.name)}">
        <label class="f" for="m-phone">手機</label>
        <input class="in" id="m-phone" inputmode="tel" autocomplete="tel" maxlength="15" value="${esc(d.phone)}">
        <p class="warn-note" id="m-warn" hidden>改了姓名之後，別人用舊名字「${esc(d.name)}」寫給你的信會拆不開，要請他用新名字再寄。你寫過的信，署名會一起改成新名字。</p>
        <div class="btn-row"><button class="btn ghost" id="m-cancel" type="button">取消</button><button class="btn gold" id="m-save" type="button">儲存</button></div>
      </div>` : '<p>目前沒有你的資料。</p>'}
      <div class="btn-row col" style="margin:8px 0 0">
        <a class="btn ghost block" id="m-mine" href="?mine${DEMO ? '&demo=mine' : ''}">查看我寫過的信</a>
        <button class="btn gold block" id="m-write" type="button">我要寫信</button>
      </div>
    </div>
    ${myActsHtml(d.acts || [])}
    <div class="card">
      <p class="small muted" style="margin-top:0">用公用電腦或別人的手機？用完記得登出，下一個人就看不到你的資料。登出不會刪掉你的資料，下次登入就回來。</p>
      <button class="btn ghost block" id="m-logout" type="button">登出</button>
    </div>
    ${d.found || d.sent ? `<p class="small muted">刪除後，你的姓名手機、你寫的信（含照片連結）與收信紀錄都會刪掉，下次使用要重新填寫。</p>
    <button class="btn danger block" id="m-del" type="button">刪除我的資料</button>` : ''}`);
  const goWrite = () => { location.href = writeHref(PARAMS.get('act') || lastAct()); };
  document.querySelectorAll('[data-myact]').forEach(b => b.onclick = () => {
    const x = (d.acts || []).find(a => a.id === b.dataset.myact); if (!x) return;
    location.href = x.state === 'open' ? writeHref(x.id) : `?mine&only=${encodeURIComponent(x.id)}${DEMO ? '&demo=mine' : ''}`;
  });
  $('m-logout').onclick = e => armThen(e.currentTarget, '確定登出？再按一次', () => logout());
  if ($('m-write')) $('m-write').onclick = goWrite;
  if ($('m-edit')) {
    const open = on => { $('m-form').hidden = !on; $('m-edit').hidden = on; $('m-edit').setAttribute('aria-expanded', on); if (on) $('m-name').focus(); };
    $('m-edit').onclick = () => open(true);
    $('m-cancel').onclick = () => { $('m-name').value = d.name; $('m-phone').value = d.phone; $('m-warn').hidden = true; open(false); };
    $('m-name').oninput = () => { $('m-warn').hidden = normKey($('m-name').value) === normKey(d.name); };
    $('m-save').onclick = e => busy(e.currentTarget, async rid => {
      const name = $('m-name').value.trim(), phone = $('m-phone').value.trim();
      if (!name) { $('m-name').focus(); throw new Error('請填寫姓名'); }
      if (phone.replace(/\D/g, '').length < 9) { $('m-phone').focus(); throw new Error('請填寫完整手機號碼'); }
      const r = await api('updateMyData', { name, phone, rid });
      if (ME) ME.name = r.name;
      cacheDel('home');
      toast(r.renamed ? `已改成「${r.name}」` : '已儲存');
      myDataFlow();
    });
  }
  const del = $('m-del');
  if (del) del.onclick = e => armThen(e.currentTarget, '再按一次確定刪除', () => busy(e.currentTarget, async rid => {
    await api('deleteMyData', { rid }); setSession(null); toast('已刪除你的資料'); myDataFlow();
  }));
}

/* ================= 傳到 LINE ================= */
/** 朋友／群組選單一次只開一個：選單開著時再按，直接當作沒按 */
let PICKING = false;
async function pick(messages, okText) {
  if (PICKING) return false;
  PICKING = true;
  try { return await openPicker(messages, okText); } finally { PICKING = false; }
}
async function openPicker(messages, okText) {
  if (!liff.isLoggedIn()) { toast('需要先登入 LINE 一次'); setTimeout(() => liff.login({ redirectUri: location.href }), 600); return false; }
  if (!liff.isApiAvailable('shareTargetPicker')) { toast('無法開啟選單，請確認 LIFF 已開啟 Share target picker'); return false; }
  try {
    const res = await liff.shareTargetPicker(messages, { isMultiple: true });
    toast(res ? (DEMO ? '預覽模式：正式版會在這裡跳出朋友／群組選單' : okText) : '已取消');
    return !!res;
  } catch (e) { toast('傳送失敗：' + e.message); return false; }
}

async function sendLetter(l) {
  if (PICKING) return false;
  const ok = await pick([letterFlex(l)], '信已送出');
  if (ok) { try { await api('markSent', { letterId: l.id, rid: newRid() }); } catch (e) {} }
  return ok;
}
const sendAct = a => pick([actFlex(a)], '已發到群組');

/** 活動人數標籤：先「已有 XX 人寫信」，再「已有 XX 人收到關心」。0 不顯示。圖卡送出當下快照，發出後不會自動更新。 */
function actCountParts(writers, loved) {
  const parts = [];
  if (+writers > 0) parts.push(`已有 ${+writers} 人寫信`);
  if (+loved > 0) parts.push(`已有 ${+loved} 人收到關心`);
  return parts;
}
function actCountBadges(a, cls) {
  const parts = actCountParts(a && a.writers, a && a.loved);
  if (!parts.length) return '';
  return `<div class="act-counts${cls ? ' ' + cls : ''}">${parts.map(t => `<span class="act-count">${esc(t)}</span>`).join('')}</div>`;
}
const lovedLine = (loved, t, writers) => {
  const parts = actCountParts(writers, loved);
  if (!parts.length) return [];
  return [{ type: 'box', layout: 'vertical', margin: 'xs', spacing: 'xs', contents: parts.map(text => ({
    type: 'box', layout: 'horizontal', paddingAll: '6px', paddingStart: '10px', paddingEnd: '10px', cornerRadius: '999px', backgroundColor: t.line,
    contents: [{ type: 'text', text, size: 'xs', color: t.accent, weight: 'bold', wrap: true, flex: 1 }]
  })) }];
};

/** 信封圖卡：只寫收信人，內容要按「收信」才看得到 */
function letterFlex(l) {
  const p = paperOf(l.paper);
  return { type: 'flex', altText: `✉️ 有一封給 ${l.to} 的信`.slice(0, 400), contents: {
    type: 'bubble', size: 'kilo',
    styles: { body: { backgroundColor: p.paper }, footer: { backgroundColor: p.paper } },
    body: { type: 'box', layout: 'vertical', paddingAll: '18px', contents: [
      { type: 'text', text: '✉️ ' + (l.actTitle || '流通神聖的愛信'), size: 'xs', color: p.accent, weight: 'bold', wrap: true },
      ...lovedLine(l.loved, p, l.writers),
      { type: 'box', layout: 'vertical', margin: 'md', backgroundColor: p.env, cornerRadius: '10px', paddingAll: '16px', paddingTop: '22px', contents: [
        { type: 'box', layout: 'vertical', width: '44px', height: '44px', cornerRadius: '22px', backgroundColor: p.accent, justifyContent: 'center', alignItems: 'center',
          contents: [{ type: 'text', text: p.sym, color: '#FFFFFF', size: 'lg', align: 'center' }] },
        { type: 'text', text: 'To.', size: 'xs', color: p.ink, margin: 'lg' },
        { type: 'text', text: String(l.to), size: 'xl', weight: 'bold', color: p.ink, wrap: true },
        { type: 'text', text: '只有本人拆得開', size: 'xxs', color: p.ink, margin: 'sm' } ] } ] },
    footer: { type: 'box', layout: 'vertical', paddingAll: '14px', paddingTop: '0px', spacing: 'xs', contents: [
      { type: 'button', style: 'primary', color: p.accent, height: 'sm', action: { type: 'uri', label: '收信', uri: letterUrl(l.id) } },
      { type: 'button', style: 'link', height: 'sm', color: p.ink, action: { type: 'uri', label: '轉傳給其他朋友', uri: fwdUrl(l.id) } } ] },
  } };
}

/** 寫信入口卡：發到群組，大家按「寫一封愛的信」 */
function actFlex(a) {
  const p = paperOf(a.paper);
  const body = [
    { type: 'text', text: '✉️ 流通神聖的愛圖卡', size: 'xs', color: p.accent, weight: 'bold' },
    { type: 'text', text: a.title, size: 'xl', weight: 'bold', color: p.ink, wrap: true, margin: 'sm' },
    ...lovedLine(a.loved, p, a.writers) ];
  if (a.desc) body.push({ type: 'text', text: a.desc.length > 160 ? a.desc.slice(0, 158) + '…' : a.desc, size: 'sm', color: '#67645F', wrap: true, margin: 'md' });
  if (shortTime(a.deadline)) body.push({ type: 'text', text: '寫信截止 ' + shortTime(a.deadline), size: 'xs', color: '#67645F', margin: 'md' });
  return { type: 'flex', altText: `✉️ ${a.title}：${btnLabel(a)}`.slice(0, 400), contents: {
    type: 'bubble',
    ...(isHttps(a.image) ? { hero: { type: 'image', url: a.image, size: 'full', aspectRatio: '20:13', aspectMode: 'cover', action: { type: 'uri', label: btnLabel(a), uri: actUrl(a.id) } } } : {}),
    styles: { body: { backgroundColor: p.paper }, footer: { backgroundColor: p.paper } },
    body: { type: 'box', layout: 'vertical', paddingAll: '20px', contents: body },
    footer: { type: 'box', layout: 'vertical', paddingAll: '16px', paddingTop: '0px', spacing: 'xs', contents: [
      { type: 'button', style: 'primary', color: p.accent, height: 'sm', action: { type: 'uri', label: btnLabel(a), uri: actUrl(a.id) } },
      { type: 'button', style: 'link', height: 'sm', color: p.ink, action: { type: 'uri', label: '轉傳給其他群組或朋友', uri: shareUrl(a.id) } } ] },
  } };
}

main();
</script>
